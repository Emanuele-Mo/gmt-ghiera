name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gmt-bezel-apk
          path: app/build/outputs/apk/debug/*.apk
      # Pubblica l'APK sempre allo stesso link:
      # https://github.com/Emanuele-Mo/gmt-ghiera/releases/latest/download/app-debug.apk
      - name: Pubblica release "ultima"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag 2>/dev/null || true
          gh release create ultima app/build/outputs/apk/debug/app-debug.apk \
            --title "Ultima build ($(git log -1 --format=%s | head -c 60))" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}" --latest
