name: Scarica foto Luna (una tantum)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sorgenti
          # Mosaico LRO della Luna piena, NASA Scientific Visualization Studio (SVS 5001)
          curl -fsSL -o sorgenti/moon_mosaic_print.jpg \
            https://svs.gsfc.nasa.gov/vis/a000000/a005000/a005001/moon_mosaic_print.jpg
          ls -la sorgenti
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add sorgenti
          git commit -m "Foto Luna NASA SVS 5001 (LRO) [skip ci]" || echo "nessuna modifica"
          git push
